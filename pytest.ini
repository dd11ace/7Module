[pytest]
log_cli = 1
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S

markers =
    api: API Тесты
    ui: UI Тесты
    positive: Позитивные тесты
    negative: Негативные тесты
    critical: Критические тесты
    blocker: Блокирующие тесты
    normal: Средняя важность тестов
    minor: Маленькая важность тестов
    trivial: Тривиальная важность тестов
    smoke: Smoke тесты
    regression: Регрессионные тесты
    integration: Интеграционные тесты
    get: GET запросы
    post: POST запросы
    patch: PATCH запросы
    delete: DELETE запросы
    crud: CRUD операции
    create: Тесты создания
    update: Тесты обновления
    validation: Тесты валидации
    parametrized: Параметризованные тесты
    database: Тесты базы данных